name: Windows RL snapshot concurrency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  file-io-only:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Standard-library lock and snapshot contracts
        run: python -m unittest discover -s tests -p test_v2_io_repair.py -v
      - name: Concurrent Windows readers writers monitor and process exit
        run: python -m scripts.verify_v2_io_repair verify --output outputs/ci-io-repair
