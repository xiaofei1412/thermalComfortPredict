name: Prediction, dynamics and MPC checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements/workbench.lock.txt
      - name: Install lightweight rule/replay runtime
        run: python -m pip install -r requirements/workbench.lock.txt
      - name: Recompute archived trajectory and stop decision without simulator or weights
        run: |
          python -m pip check
          python -m scripts.verify_delivery
          python -m unittest discover -s tests -p test_delivery_release.py -v
          python -m unittest discover -s tests -p test_deployment_entry.py -v
          python -m unittest discover -s tests -p test_backup_delivery.py -v
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -r requirements/rl-interface.txt
          python -m pip install -r requirements/sac.txt
      - name: Verify prediction, dynamics and MPC safety contracts
        run: python -m unittest discover -s tests -v
